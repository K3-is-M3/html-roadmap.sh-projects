<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Digital business card using HTML and CSS">
    <meta name="author" content="Kelvin Wachira">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Business Card</title>
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="blooming pink flower">
        <p class="full-name">Kelvin Wachira</p>
        <p class="designation" style="font-family:Helvetica; font-weight: bolder;">SOFTWARE DEVELOPER</p>
        <p class="company" style="font-style: italic; color: grey;">@Utility-Row</p>
        <hr>

        <p>Email: isgettinghot@jmail.com</p>
        <p>Phone: +254 700000000</p>
        <a class="portfolio-link" href="https://geek.justlikethat.xyz" target="_blank" referrerpolicy="no-referrer noopener">Portfolio</a>
        <hr>

        <div class="social-media">
            <h2>Connect with me</h2>
            <a class="twitter" href="https://x.com" target="_blank" title="Twitter" referrerpolicy="no-referrer noopener">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a class="linkedin"href="https://www.linkedin.com/in/kelvin-wachirak3/" target="_blank" title="LinkedIn" referrerpolicy="no-referrer noopener">
                <i class="fa-brands fa-linkedin"></i>
            </a>
            <a class="github" href="https://github.com/K3-is-M3" target="_blank" title="GitHub" referrerpolicy="no-referrer noopener">
                <i class="fa-brands fa-github"></i></a>
        </div>
    </div>
</body>

</html>
