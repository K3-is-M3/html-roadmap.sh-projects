<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width initial-scale=1">
    <meta name="description" content="Single HTML Contact Form Page">
    <meta name="author" content="Kelvin Wachira">
    <meta name="keywords" content="HTML, Form, CSS">
    <meta property="og:title" content="Acme Support Contact Form">
    <meta property="og:type" content="website">
</head>

<body>
    <header>
        <h1>Acme Support</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#help">Help</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <hr>
    <main>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Send us a message and we will get back to you.</p>

            <form>
                <div class="form-group">
                    <label for="name">Full name </label>
                    <input required type="text" id="name" name="name">
                </div><br>

                <div class="form-group">
                    <label for="mail">Email </label>
                    <input required type="email" id="mail" name="mail">
                </div><br>

                <div class="form-group">
                    <label for="subject">Subject </label>
                    <select id="subject">
                        <option selected disabled value="topic">Choose a topic</option>
                        <option value="account-issues">Account-related issues</option>
                        <option value="subscription-issues">Subscription issues</option>
                        <option value="delete-account">Account suspension or deletion</option>
                    </select>
                </div><br>

                <div class="form-group">
                    <label for="message">Message </label>
                    <textarea name="message" id="message" cols="20" rows="10"></textarea>
                </div>

                <p>How did you hear about us?</p>

                <div class="form-group">
                    <input type="radio" id="search" name="client-discovery">
                    <label for="search">Search</label>
                </div>

                <div class="form-group">
                    <input type="radio" id="friend" name="client-discovery">
                    <label for="friend">Friend</label>
                </div>

                <div class="form-group">
                    <input type="radio" id="social-media" name="client-discovery">
                    <label for="social-media">Social media</label>
                </div><br>

                <div class="form-group">
                    <input type="checkbox" id="updates" name="updates">
                    <label for="updates">Send me product updates</label>
                </div><br>

                <button type="submit">Send message</button>
            </form>
        </section>
    </main>
</body>

</html>
